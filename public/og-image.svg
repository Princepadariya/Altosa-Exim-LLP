    <circle r="58" stroke="#0f8da8" stroke-opacity="0.9" stroke-width="3"/>
    <circle cx="133" cy="0" r="12"/>
    <circle cx="66" cy="115" r="12"/>
    <circle cx="-66" cy="115" r="12"/>
    <circle cx="-133" cy="0" r="12"/>
