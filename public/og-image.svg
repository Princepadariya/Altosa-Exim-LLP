    </text>
    <text x="0" y="235" fill="#0f8da8" font-family="Sora, Segoe UI, sans-serif" font-size="76" font-weight="700" letter-spacing="-2">
      sourcing.
    </text>

    <text x="0" y="300" fill="#9fb0c8" font-family="Inter, Segoe UI, sans-serif" font-size="26">
