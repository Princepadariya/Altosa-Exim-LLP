<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080f" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG: iOS does not support SVG for the home-screen icon and would fall
         back to a screenshot of the page. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts: preconnect first so the display/mono faces arrive early. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <!-- Fallback title and description; React replaces these per route. -->
    <title>Industrial Sourcing &amp; Export Partner in India | Altosa Exim LLP</title>
    <meta
      name="description"
      content="Altosa Exim LLP is a merchant exporter and commission agent in Rajkot, India, sourcing engineering, automotive and electrical components against buyer drawings and specifications."
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Altosa Exim LLP — merchant exporter and commission agent, Rajkot, Gujarat,
      India. This site needs JavaScript enabled. To send a sourcing requirement,
      email exim@altosaeximllp.com with your drawing or specification, material,
      quantity and destination.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
